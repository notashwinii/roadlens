name: roadlens

x-backend-environment: &backend-environment
  DB_HOST: database
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-roadlens}
  DB_USER: ${DB_USER:-roadlens}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
  ROADLENS_MASTER_KEY: ${ROADLENS_MASTER_KEY:?Set ROADLENS_MASTER_KEY}
  ROADLENS_PUBLIC_URL: ${ROADLENS_PUBLIC_URL:?Set ROADLENS_PUBLIC_URL}
  ROADLENS_COOKIE_SECURE: ${ROADLENS_COOKIE_SECURE:-true}
  ROADLENS_CORS_ORIGINS: ${ROADLENS_CORS_ORIGINS:-}
  ROADLENS_EMAIL_MODE: ${ROADLENS_EMAIL_MODE:-console}
  ROADLENS_EMAIL_FROM: ${ROADLENS_EMAIL_FROM:-}
  ROADLENS_SMTP_HOST: ${ROADLENS_SMTP_HOST:-}
  ROADLENS_SMTP_PORT: ${ROADLENS_SMTP_PORT:-587}
  ROADLENS_SMTP_TLS: ${ROADLENS_SMTP_TLS:-true}
  ROADLENS_SMTP_USERNAME: ${ROADLENS_SMTP_USERNAME:-}
  ROADLENS_SMTP_PASSWORD: ${ROADLENS_SMTP_PASSWORD:-}
  ROADLENS_OIDC_PROVIDER_NAME: ${ROADLENS_OIDC_PROVIDER_NAME:-Company SSO}
  ROADLENS_OIDC_ISSUER: ${ROADLENS_OIDC_ISSUER:-}
  ROADLENS_OIDC_CLIENT_ID: ${ROADLENS_OIDC_CLIENT_ID:-}
  ROADLENS_OIDC_CLIENT_SECRET: ${ROADLENS_OIDC_CLIENT_SECRET:-}
  ROADLENS_OIDC_REDIRECT_URI: ${ROADLENS_OIDC_REDIRECT_URI:-}
  ROADLENS_OIDC_AUTO_PROVISION: ${ROADLENS_OIDC_AUTO_PROVISION:-false}
  ROADLENS_OIDC_REQUIRE_VERIFIED_EMAIL: ${ROADLENS_OIDC_REQUIRE_VERIFIED_EMAIL:-true}
  ROADLENS_WORKER_POLL_SECONDS: ${ROADLENS_WORKER_POLL_SECONDS:-2}
  PYTHONPATH: /app
  PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"

x-backend-service: &backend-service
  build:
    context: ./backend
    dockerfile: docker/Dockerfile
  image: roadlens-backend:latest
  environment: *backend-environment
  restart: unless-stopped

services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-roadlens}
      MARIADB_USER: ${DB_USER:-roadlens}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  migrate:
    <<: *backend-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-service
    command:
      [
        "uvicorn",
        "api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips=*",
      ]
    volumes:
      - camera_uploads:/app/uploads
      - evidence_outputs:/app/outputs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8000/api/ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *backend-service
    command: ["python", "-m", "jobs.worker"]
    volumes:
      - camera_uploads:/app/uploads
      - evidence_outputs:/app/outputs
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: roadlens-frontend:latest
    ports:
      - "${ROADLENS_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  database_data:
  camera_uploads:
  evidence_outputs:
