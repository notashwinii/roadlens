name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -vv
        env:
          DATABASE_URL: sqlite:////tmp/roadlens-tests.sqlite
      - name: Verify migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:////tmp/roadlens-migrations.sqlite

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build

  deployment-config:
    name: Deployment config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate production Compose
        run: docker compose --env-file .env.example -f compose.production.yml config --quiet
