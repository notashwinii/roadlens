services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: readtheroad-api:latest
    container_name: readtheroad-api
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../api:/app/api
      - ../configs:/app/configs:ro
      - ../core:/app/core
      - ../ingestion:/app/ingestion
      - ../ocr:/app/ocr
      - ../db:/app/db
      - ../rules:/app/rules
      - ../scene:/app/scene
      - ../evidence:/app/evidence
      - ../jobs:/app/jobs
      - ../migrations:/app/migrations
      - ../models:/app/models:ro
      - ../uploads:/app/uploads
      - ../alembic.ini:/app/alembic.ini:ro
      - ../pipeline.py:/app/pipeline.py:ro
      - ../outputs:/app/outputs
    environment:
      PYTHONPATH: /app
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    command:
      [
        "uvicorn",
        "api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: readtheroad-api:latest
    container_name: readtheroad-worker
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../configs:/app/configs:ro
      - ../core:/app/core
      - ../ingestion:/app/ingestion
      - ../ocr:/app/ocr
      - ../db:/app/db
      - ../rules:/app/rules
      - ../scene:/app/scene
      - ../evidence:/app/evidence
      - ../jobs:/app/jobs
      - ../migrations:/app/migrations
      - ../models:/app/models:ro
      - ../uploads:/app/uploads
      - ../alembic.ini:/app/alembic.ini:ro
      - ../pipeline.py:/app/pipeline.py:ro
      - ../outputs:/app/outputs
    environment:
      PYTHONPATH: /app
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    command: ["python", "-m", "jobs.worker"]

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: readtheroad-app:latest
    container_name: readtheroad-app
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../configs:/app/configs:ro
      - ../core:/app/core
      - ../ingestion:/app/ingestion
      - ../ocr:/app/ocr
      - ../db:/app/db
      - ../rules:/app/rules
      - ../scene:/app/scene
      - ../evidence:/app/evidence
      - ../migrations:/app/migrations
      - ../models:/app/models:ro
      - ../alembic.ini:/app/alembic.ini:ro
      - ../main.py:/app/main.py:ro
      - ../pipeline.py:/app/pipeline.py:ro
      - ../test_video.mp4:/app/test_video.mp4:ro
      - ../outputs:/app/outputs
    environment:
      PYTHONPATH: /app
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      VIDEO_PATH: /app/test_video.mp4
    command: ["python", "main.py"]

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: readtheroad-web:latest
    container_name: readtheroad-web
    ports:
      - "8501:8501"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../configs:/app/configs:ro
      - ../core:/app/core
      - ../ingestion:/app/ingestion
      - ../ocr:/app/ocr
      - ../db:/app/db
      - ../rules:/app/rules
      - ../scene:/app/scene
      - ../evidence:/app/evidence
      - ../models:/app/models:ro
      - ../app.py:/app/app.py:ro
      - ../pipeline.py:/app/pipeline.py:ro
      - ../outputs:/app/outputs
    environment:
      PYTHONPATH: /app
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0"]

  lab:
    profiles: ["lab"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: readtheroad-app:latest
    container_name: readtheroad-lab
    ports:
      - "8888:8888"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../configs:/app/configs:ro
      - ../core:/app/core
      - ../ingestion:/app/ingestion
      - ../ocr:/app/ocr
      - ../db:/app/db
      - ../rules:/app/rules
      - ../scene:/app/scene
      - ../evidence:/app/evidence
      - ../migrations:/app/migrations
      - ../models:/app/models:ro
      - ../alembic.ini:/app/alembic.ini:ro
      - ../main.py:/app/main.py:ro
      - ../pipeline.py:/app/pipeline.py:ro
      - ../test_video.mp4:/app/test_video.mp4:ro
      - ../outputs:/app/outputs
    environment:
      PYTHONPATH: /app
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--allow-root", "--no-browser"]
