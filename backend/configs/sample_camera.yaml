camera:
  id: demo_intersection_01
  name: Demo Intersection Camera
  source_type: video_file
  source_path: test_video.mp4
  reference_resolution: [1920, 1080]
  timezone: Asia/Kathmandu

models:
  vehicle_detector: yolo26n.pt
  plate_detector: models/license_plate.pt
  ocr_engine: paddleocr

zones:
  - id: detection_roi_main
    name: Main Detection ROI
    type: detection_roi
    shape: rectangle
    enabled: true
    description: Region where motion-triggered ALPR is currently allowed to run.
    points_normalized:
      - [0.10, 0.25]
      - [0.90, 0.25]
      - [0.90, 0.90]
      - [0.10, 0.90]

  - id: stop_line_main
    name: Main Stop Line
    type: stop_line
    shape: polygon
    enabled: true
    description: Stop-line zone for future red-light violation rule.
    points_normalized:
      - [0.22, 0.72]
      - [0.68, 0.70]
      - [0.69, 0.76]
      - [0.23, 0.79]

  - id: zebra_crossing_main
    name: Main Zebra Crossing
    type: zebra_crossing
    shape: polygon
    enabled: true
    description: Crosswalk area for future pedestrian-phase encroachment rule.
    points_normalized:
      - [0.18, 0.58]
      - [0.72, 0.55]
      - [0.75, 0.65]
      - [0.20, 0.68]

  - id: restricted_lane_left
    name: Restricted Left Lane
    type: restricted_zone
    shape: polygon
    enabled: true
    description: Restricted lane for future forbidden-zone entry rule.
    points_normalized:
      - [0.05, 0.30]
      - [0.32, 0.28]
      - [0.38, 0.90]
      - [0.02, 0.92]

conditions:
  - id: always_forbidden
    name: Always Forbidden
    type: always_true
    enabled: true

  - id: red_light_main
    name: Main Signal Red Phase
    type: manual_state
    enabled: true
    key: traffic_light_main
    value: red

  - id: pedestrian_phase_main
    name: Pedestrian Crossing Phase
    type: manual_state
    enabled: false
    key: pedestrian_signal_main
    value: walk

rules:
  - id: red_light_stop_line
    name: Red Light Stop-Line Violation
    enabled: true
    when:
      all:
        - event: vehicle_intersects_zone
          zone_type: stop_line
        - condition: red_light_main
    actions:
      - create_violation_event
      - capture_license_plate
      - send_to_review

  - id: restricted_zone_entry
    name: Restricted Zone Entry
    enabled: true
    when:
      all:
        - event: vehicle_intersects_zone
          zone_type: restricted_zone
        - condition: always_forbidden
    actions:
      - create_violation_event
      - capture_license_plate
      - send_to_review

  - id: zebra_crossing_encroachment
    name: Zebra Crossing Encroachment
    enabled: false
    when:
      all:
        - event: vehicle_intersects_zone
          zone_type: zebra_crossing
        - condition: pedestrian_phase_main
    actions:
      - create_violation_event
      - capture_license_plate
      - send_to_review

frame_selection:
  motion_threshold: 100
  cooldown_frames: 10
  sharpness_method: laplacian_variance
  score_method: motion_area_times_sharpness

detection:
  vehicle_confidence: 0.35
  plate_confidence: 0.0

storage:
  save_to_db: true
  save_evidence_images: true
  output_dir: outputs/evidence
  review_status_default: pending
  save_selected_frame: true
  save_vehicle_crop: true
  save_plate_crop: true
